name: Keep Render service warm

# Render's free tier spins the service down after ~15 minutes with no
# incoming requests, and a cold start then takes 30-60s for the first
# request after that. Pinging /health every 10 minutes keeps a
# comfortable margin under that threshold so the service stays warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS https://portfolio-manager-backend-y07u.onrender.com/health
